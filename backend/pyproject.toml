[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ina_core"
version = "0.2.0"
description = "Pure business logic + FastAPI layer for the data_ina thematic analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.30",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.110",
]
hf = [
    "huggingface-hub>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ina_core*", "ina_api*"]
